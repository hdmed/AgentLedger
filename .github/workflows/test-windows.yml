name: test-windows
on: [push, pull_request]
jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m py_compile extract.py extract_kilo.py extract_autoclaw.py extract_workbuddy.py build_report.py resources.py launcher.py build_exe.py notification.py
      - run: python -m unittest discover -s tests -v
      - run: |
          if (-not (Test-Path data/dataset.json)) {
            Write-Host "CI: dataset manquant, création dummy"
            New-Item -ItemType Directory -Path data -Force | Out-Null
            python -c "import json; json.dump({'generated_at':'2026-08-30T00:00:00Z','db_path':'ci','pricing_config':{'models':{}},'budgets':{},'models':[],'totals':{'cost':0,'sessions':0,'tokens_input':0,'tokens_output':0,'tokens_reasoning':0,'tokens_cache_read':0,'tokens_cache_write':0},'sessions':[]}, open('data/dataset.json','w'))"
          }
          python build_report.py --strict
        shell: powershell
      - run: pip install pyinstaller
      - run: python build_exe.py --confirm
      - run: |
          $env:AGENTLEDGER_USER_DIR = "$env:TEMP\oc_ci_user"
          .\dist\AgentLedger.exe --version
          .\dist\AgentLedger.exe --diagnose
        shell: powershell
